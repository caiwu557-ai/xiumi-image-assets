name: Fetch historical images

on:
  push:
    paths:
      - ".github/workflows/fetch-historical-images.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download historical images
        run: |
          set -euo pipefail
          mkdir -p historical
          curl -L --fail --retry 5 --retry-delay 2 \
            "https://upload.wikimedia.org/wikipedia/commons/6/6f/1960s_portrait_of_Merrill_Chase.jpg" \
            -o historical/merrill_chase_portrait.jpg
          curl -L --fail --retry 5 --retry-delay 2 \
            "https://upload.wikimedia.org/wikipedia/commons/5/5a/Karl_Landsteiner_1930.jpg" \
            -o historical/karl_landsteiner_1930.jpg
          file historical/*.jpg
          test -s historical/merrill_chase_portrait.jpg
          test -s historical/karl_landsteiner_1930.jpg

      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historical/*.jpg
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add historical Merrill Chase and Karl Landsteiner photos"
            git push
          fi

# trigger refresh
